<!doctype html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com">
  <script src="./auth.js"></script>
  <script>window.__athomeNeedsFirestore__ = true;</script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <title>앳홈 업무 트래커</title>
  <script>
    if (new URLSearchParams(location.search).get('shell') === '1') {
      document.documentElement.classList.add('shell-mode');
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231A1A1A'/><rect x='12' y='55' width='18' height='33' rx='4' fill='%23FF5D00'/><rect x='41' y='35' width='18' height='53' rx='4' fill='%23FF5D00'/><rect x='70' y='18' width='18' height='70' rx='4' fill='%23FF5D00'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --accent:#FF5D00; --accent-light:rgba(255,93,0,.08);
  --text-1:#1A1714; --text-2:#4A4540; --text-3:#6B6660; --text-4:#A8A29A;
  --bg-page:#F5F4F1; --bg-card:#FFFFFF; --bg-soft:#F0EEE9; --bg-gray:#E9E6E0;
  --border:#ECEAE5; --border-2:#DAD6CF;
  --radius:12px;
  --shadow:0 1px 2px rgba(40,30,20,.03),0 3px 14px rgba(40,30,20,.035);
  --font:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);font-size:14px;color:var(--text-1);background:var(--bg-page);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;line-height:1.6;}
.wrap{max-width:1360px;margin:0 auto;padding:24px 24px 64px;}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:60;background:rgba(245,244,241,.85);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border);}
.topbar-in{max-width:1360px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:14px;}
.shell-mode .topbar .brand{display:none!important;}
.shell-mode .topbar-in{max-width:none;padding-left:24px;padding-right:24px;}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0;}
.brand img{height:15px;display:block;}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em;}
.brand .sep{width:1px;height:16px;background:var(--border-2);}
.brand span{font-size:13px;font-weight:700;color:var(--text-3);}
.spacer{flex:1;}
.last-upd{font-size:11.5px;color:var(--text-4);white-space:nowrap;}

/* ── LEGEND ── */
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.legend-chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg-card);border:1.5px solid transparent;border-radius:20px;box-shadow:var(--shadow);padding:6px 12px 6px 8px;font-size:12px;font-weight:700;color:var(--text-2);cursor:pointer;transition:border-color .12s,opacity .12s;}
.legend-chip:hover{opacity:.85;}
.legend-chip.active{border-color:currentColor;}
.legend.filtering .legend-chip:not(.active){opacity:.4;}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* ── BOARD ── */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:start;}
@media (max-width:920px){.board{grid-template-columns:1fr;}}
.col{background:var(--bg-soft);border-radius:14px;padding:14px;min-height:120px;transition:background .12s;}
.col.drag-over{background:var(--accent-light);}
.col-h{display:flex;align-items:center;gap:8px;margin-bottom:12px;padding:0 2px;}
.col-h .t{font-size:13.5px;font-weight:800;}
.col-h .n{font-size:11.5px;font-weight:700;color:var(--text-4);background:var(--bg-gray);border-radius:20px;padding:2px 8px;}

.cardlist{display:flex;flex-direction:column;gap:9px;min-height:8px;}
.tcard{background:var(--bg-card);border-radius:10px;box-shadow:var(--shadow);padding:12px 13px;cursor:grab;position:relative;}
.tcard:active{cursor:grabbing;}
.tcard.dragging{opacity:.4;}
.tcard.drop-before{box-shadow:0 -3px 0 var(--accent),var(--shadow);}
.tcard.drop-after{box-shadow:0 3px 0 var(--accent),var(--shadow);}
.tcard.hidden-by-filter{display:none;}
.tcard-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px;}
.proj-badge{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;padding:3px 8px;border-radius:20px;white-space:nowrap;}
.proj-badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor;}
.tcard-actions{display:flex;gap:2px;flex-shrink:0;}
.tcard-edit,.tcard-del{background:none;border:none;color:var(--text-4);cursor:pointer;font-size:13px;line-height:1;padding:3px 5px;border-radius:5px;opacity:0;transition:opacity .12s;}
.tcard:hover .tcard-edit,.tcard:hover .tcard-del{opacity:1;}
.tcard-edit:hover,.tcard-del:hover{background:var(--bg-gray);color:var(--text-1);}
.tcard-title{font-size:13px;color:var(--text-1);line-height:1.5;font-weight:600;}
.tcard.editing{cursor:default;display:flex;flex-direction:column;gap:6px;}

/* ── ADD FORM ── */
.add-row{margin-top:10px;}
.add-toggle{width:100%;text-align:left;background:none;border:none;font-size:12.5px;font-weight:700;color:var(--text-4);cursor:pointer;padding:8px 2px;border-radius:8px;}
.add-toggle:hover{background:var(--bg-gray);color:var(--text-2);}
.add-form{display:none;flex-direction:column;gap:6px;background:var(--bg-card);border-radius:10px;padding:10px;box-shadow:var(--shadow);}
.add-form.open{display:flex;}
.add-form select,.add-form textarea,.tcard.editing select,.tcard.editing textarea{width:100%;border:1px solid var(--border-2);border-radius:7px;padding:7px 9px;font-family:inherit;font-size:12.5px;color:var(--text-1);background:#fff;outline:none;resize:none;}
.add-form select:focus,.add-form textarea:focus,.tcard.editing select:focus,.tcard.editing textarea:focus{border-color:var(--accent);}
.add-form-actions{display:flex;gap:6px;justify-content:flex-end;}
.add-form-actions button{border:none;border-radius:7px;padding:6px 12px;font-family:inherit;font-size:12px;font-weight:700;cursor:pointer;}
.btn-save{background:var(--accent);color:#fff;}
.btn-cancel{background:var(--bg-gray);color:var(--text-2);}

.empty-hint{font-size:12px;color:var(--text-4);text-align:center;padding:10px 0;}
.footer-note{margin-top:24px;font-size:11.5px;color:var(--text-4);text-align:center;}

@media (prefers-color-scheme: dark){
  :root{
    --text-1:#F2EEE6; --text-2:#CFC9BC; --text-3:#9C968A; --text-4:#726C61;
    --bg-page:#18160F; --bg-card:#242019; --bg-soft:#2C2820; --bg-gray:#332D22;
    --border:#3A352B; --border-2:#453F33;
    --accent:#FF7A33; --accent-light:rgba(255,122,51,.14);
    --shadow:0 1px 2px rgba(0,0,0,.2),0 3px 14px rgba(0,0,0,.22);
  }
}
:root[data-theme="dark"]{
  --text-1:#F2EEE6; --text-2:#CFC9BC; --text-3:#9C968A; --text-4:#726C61;
  --bg-page:#18160F; --bg-card:#242019; --bg-soft:#2C2820; --bg-gray:#332D22;
  --border:#3A352B; --border-2:#453F33;
  --accent:#FF7A33; --accent-light:rgba(255,122,51,.14);
  --shadow:0 1px 2px rgba(0,0,0,.2),0 3px 14px rgba(0,0,0,.22);
}
:root[data-theme="light"]{
  --text-1:#1A1714; --text-2:#4A4540; --text-3:#6B6660; --text-4:#A8A29A;
  --bg-page:#F5F4F1; --bg-card:#FFFFFF; --bg-soft:#F0EEE9; --bg-gray:#E9E6E0;
  --border:#ECEAE5; --border-2:#DAD6CF;
  --accent:#FF5D00; --accent-light:rgba(255,93,0,.08);
  --shadow:0 1px 2px rgba(40,30,20,.03),0 3px 14px rgba(40,30,20,.035);
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/beodle/athome-assets/main/ATHOME_CI_screen.svg" alt="ATHOME" style="filter:none">
      <b>채용 콘텐츠</b><div class="sep"></div><span>업무 트래커</span>
    </div>
    <div class="spacer"></div>
    <span id="taskCount" class="last-upd"></span>
  </div>
</header>

<div class="wrap">
  <div class="legend" id="legend"></div>

  <div class="board">
    <section class="col" data-status="todo">
      <div class="col-h"><span class="t">다음 할 일</span><span class="n" id="cnt-todo">0</span></div>
      <div class="cardlist" id="list-todo"></div>
      <div class="add-row" id="addrow-todo"></div>
    </section>
    <section class="col" data-status="doing">
      <div class="col-h"><span class="t">진행 중</span><span class="n" id="cnt-doing">0</span></div>
      <div class="cardlist" id="list-doing"></div>
      <div class="add-row" id="addrow-doing"></div>
    </section>
    <section class="col" data-status="done">
      <div class="col-h"><span class="t">완료</span><span class="n" id="cnt-done">0</span></div>
      <div class="cardlist" id="list-done"></div>
      <div class="add-row" id="addrow-done"></div>
    </section>
  </div>

  <div class="footer-note">카드를 드래그해서 컬럼 사이로 옮기면 상태가 바로 저장돼요 · project-status.md와는 별개로 관리되는 작업 리스트입니다</div>
</div>

<script>
const PROJECTS = [
  { key: 'PR', color: '#2563EB' },
  { key: '채용-콘텐츠', color: '#059669' },
  { key: '오프라인', color: '#7C3AED' },
  { key: '채용브랜딩', color: '#DB2777' },
  { key: '팀블로그', color: '#0891B2' },
  { key: '채용-사이트', color: '#B45309' },
  { key: '채용-인프라', color: '#475569' },
];
const PROJECT_COLOR = Object.fromEntries(PROJECTS.map(p => [p.key, p.color]));
const STATUSES = ['todo', 'doing', 'done'];

// 최초 1회 시딩용 시드 데이터 — tracker-content.json의 진행 중/다음 할 일을 개별 카드로 변환.
// 이후로는 이 배열을 다시 안 쓰고 Firestore(trackerTasks)가 유일한 데이터 소스가 된다.
const SEED_TASKS = [
  { project: 'PR', status: 'doing', title: 'HR Insight 9월호 — 8/20 최종 마감' },
  { project: 'PR', status: 'doing', title: 'PR 요청 접수 Slack 워크플로 — 김은경님 초안 공유 대기' },
  { project: 'PR', status: 'todo', title: '매일경제 칼럼 연재 가능성 검토' },

  { project: '채용-콘텐츠', status: 'doing', title: '홈레코딩 4화 녹음 대기 중' },
  { project: '채용-콘텐츠', status: 'todo', title: '홈레코딩 1~3화 편집 → Spotify/Apple Podcasts 배포' },
  { project: '채용-콘텐츠', status: 'todo', title: '카드뉴스 매주 자동 실행 세팅' },

  { project: '오프라인', status: 'doing', title: '브랜드콘 현장 촬영본 편집 검토 및 활용 방향 확정' },
  { project: '오프라인', status: 'todo', title: '팀 참관 후기 취합' },
  { project: '오프라인', status: 'todo', title: '브랜드콘 성료 소식 자체 채널 홍보' },

  { project: '채용브랜딩', status: 'doing', title: '앳홈그라운드 슬로건 최종 확정 — 팀 컨펌 필요' },
  { project: '채용브랜딩', status: 'doing', title: '정호님 홈레코딩 특집 출연 일정 요청' },
  { project: '채용브랜딩', status: 'doing', title: 'BAT 세션 일정·구성 기획' },
  { project: '채용브랜딩', status: 'todo', title: '채용공고 언어 가이드 실제 JD 적용' },
  { project: '채용브랜딩', status: 'todo', title: 'IEP 인물 사례 콘텐츠화 (황지홍/송지수)' },

  { project: '팀블로그', status: 'todo', title: '홈그라운드 브랜딩 히어로 캐러셀 — 웹 에디터 적용·검증' },
  { project: '팀블로그', status: 'todo', title: '본문 타이포 코드 수집 (폰트 탭)' },
  { project: '팀블로그', status: 'todo', title: 'FAQ 포스트 + FAQPage JSON-LD' },
  { project: '팀블로그', status: 'todo', title: 'GA4 블로그 property 서비스 계정 권한 추가' },

  { project: '채용-사이트', status: 'doing', title: '채용 페이지 리디자인 (히어로 외 나머지 섹션) — 기획 중' },
  { project: '채용-사이트', status: 'todo', title: '채용 페이지 IA 개선 로드맵 수립' },
  { project: '채용-사이트', status: 'todo', title: '6/30 월말 데이터로 개편 효과 재검정' },

  { project: '채용-인프라', status: 'doing', title: '데이터 해석 프레임 정착 (퍼널 전환율 중심으로 읽기)' },
  { project: '채용-인프라', status: 'todo', title: '팔로워 직무·산업 분해 지표 추가' },
  { project: '채용-인프라', status: 'todo', title: '팟캐스트 시청 지속률 연동 (채널 소유권 확보 후)' },
];

let db = null;
let tasks = [];
let draggingId = null;
let dropTarget = null; // { id, before }
let editingIds = new Set();
let activeFilter = null; // project key, or null = 전체

function escHtml(s){
  return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderLegend(){
  const el = document.getElementById('legend');
  el.innerHTML = PROJECTS.map(p => `
    <span class="legend-chip" data-project="${escHtml(p.key)}" style="color:${p.color}">
      <span class="legend-dot" style="background:${p.color}"></span>${escHtml(p.key)}
    </span>
  `).join('');
  el.querySelectorAll('.legend-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const key = chip.dataset.project;
      activeFilter = activeFilter === key ? null : key;
      applyFilterUI();
      render();
    });
  });
}

function applyFilterUI(){
  const el = document.getElementById('legend');
  el.classList.toggle('filtering', !!activeFilter);
  el.querySelectorAll('.legend-chip').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.project === activeFilter);
  });
}

function projBadge(project){
  const color = PROJECT_COLOR[project] || '#6B6660';
  return `<span class="proj-badge" style="background:${color}1A;color:${color}"><span class="dot"></span>${escHtml(project)}</span>`;
}

function renderCard(t){
  if (editingIds.has(t.id)) {
    return `
      <div class="tcard editing" data-id="${t.id}">
        <select class="e-proj">${PROJECTS.map(p => `<option value="${escHtml(p.key)}" ${p.key === t.project ? 'selected' : ''}>${escHtml(p.key)}</option>`).join('')}</select>
        <textarea class="e-title" rows="2">${escHtml(t.title)}</textarea>
        <div class="add-form-actions">
          <button type="button" class="btn-cancel e-cancel" data-id="${t.id}">취소</button>
          <button type="button" class="btn-save e-save" data-id="${t.id}">저장</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="tcard" draggable="true" data-id="${t.id}">
      <div class="tcard-top">
        ${projBadge(t.project)}
        <div class="tcard-actions">
          <button class="tcard-edit" data-id="${t.id}" title="수정">✎</button>
          <button class="tcard-del" data-id="${t.id}" title="삭제">×</button>
        </div>
      </div>
      <div class="tcard-title">${escHtml(t.title)}</div>
    </div>
  `;
}

function render(){
  STATUSES.forEach(st => {
    const list = tasks.filter(t => t.status === st).sort((a,b) => (a.order||0) - (b.order||0));
    const visible = activeFilter ? list.filter(t => t.project === activeFilter) : list;
    document.getElementById('cnt-' + st).textContent = `${visible.length}${activeFilter ? ' / ' + list.length : ''}`;
    const el = document.getElementById('list-' + st);
    el.innerHTML = visible.length ? visible.map(renderCard).join('') : '<div class="empty-hint">없음</div>';
  });
  const shown = activeFilter ? tasks.filter(t => t.project === activeFilter).length : tasks.length;
  document.getElementById('taskCount').textContent = activeFilter ? `${shown} / ${tasks.length}건 표시` : `전체 ${tasks.length}건`;
  bindCardEvents();
}

function clearDropIndicators(){
  document.querySelectorAll('.tcard.drop-before,.tcard.drop-after').forEach(el => {
    el.classList.remove('drop-before', 'drop-after');
  });
}

function bindCardEvents(){
  document.querySelectorAll('.tcard[draggable="true"]').forEach(card => {
    card.addEventListener('dragstart', () => {
      draggingId = card.dataset.id;
      dropTarget = null;
      card.classList.add('dragging');
    });
    card.addEventListener('dragend', () => {
      card.classList.remove('dragging');
      clearDropIndicators();
      draggingId = null;
      dropTarget = null;
    });
    card.addEventListener('dragover', e => {
      if (!draggingId || draggingId === card.dataset.id) return;
      e.preventDefault();
      e.stopPropagation();
      const rect = card.getBoundingClientRect();
      const before = (e.clientY - rect.top) < rect.height / 2;
      clearDropIndicators();
      card.classList.add(before ? 'drop-before' : 'drop-after');
      dropTarget = { id: card.dataset.id, before };
    });
  });
  document.querySelectorAll('.tcard-del').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!confirm('이 작업을 삭제할까요?')) return;
      db.collection('trackerTasks').doc(btn.dataset.id).delete();
    });
  });
  document.querySelectorAll('.tcard-edit').forEach(btn => {
    btn.addEventListener('click', () => {
      editingIds.add(btn.dataset.id);
      render();
    });
  });
  document.querySelectorAll('.e-cancel').forEach(btn => {
    btn.addEventListener('click', () => {
      editingIds.delete(btn.dataset.id);
      render();
    });
  });
  document.querySelectorAll('.e-save').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const card = btn.closest('.tcard');
      const title = card.querySelector('.e-title').value.trim();
      const project = card.querySelector('.e-proj').value;
      if (!title) return;
      editingIds.delete(id);
      db.collection('trackerTasks').doc(id).update({ title, project });
    });
  });
}

// 드롭된 컬럼의 최종 순서를 계산해 그 컬럼 전체의 order를 다시 매긴다.
// dropTarget이 있으면 그 카드 기준 위/아래에 끼워 넣고, 없으면(컬럼 빈 공간에 드롭) 맨 뒤에 붙인다.
function reorderColumn(status, draggedId, target){
  const list = tasks.filter(t => t.status === status && t.id !== draggedId).sort((a,b) => (a.order||0) - (b.order||0));
  const draggedTask = tasks.find(t => t.id === draggedId);
  let insertAt = list.length;
  if (target) {
    const idx = list.findIndex(t => t.id === target.id);
    if (idx !== -1) insertAt = target.before ? idx : idx + 1;
  }
  list.splice(insertAt, 0, draggedTask);

  const batch = db.batch();
  list.forEach((t, i) => {
    const patch = { order: i };
    if (t.id === draggedId && t.status !== status) {
      patch.status = status;
      // 완료로 옮겨지면 완료 시각을 찍어 7일 뒤 자동 삭제(cleanupOldDone) 대상이 되게 하고,
      // 완료에서 다시 다른 컬럼으로 옮기면 스탬프를 지워 삭제 대상에서 빠지게 함.
      if (status === 'done') patch.completedAt = Date.now();
      else if (t.status === 'done') patch.completedAt = null;
    }
    batch.update(db.collection('trackerTasks').doc(t.id), patch);
  });
  batch.commit();
}

function bindColumnDrop(){
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => {
      e.preventDefault();
      col.classList.add('drag-over');
    });
    col.addEventListener('dragleave', () => col.classList.remove('drag-over'));
    col.addEventListener('drop', e => {
      e.preventDefault();
      col.classList.remove('drag-over');
      clearDropIndicators();
      if (!draggingId) return;
      const newStatus = col.dataset.status;
      const target = dropTarget && tasks.find(t => t.id === dropTarget.id && t.status === newStatus) ? dropTarget : null;
      reorderColumn(newStatus, draggingId, target);
      draggingId = null;
      dropTarget = null;
    });
  });
}

function bindAddForms(){
  STATUSES.forEach(st => {
    const row = document.getElementById('addrow-' + st);
    row.innerHTML = `
      <button class="add-toggle" type="button">+ 작업 추가</button>
      <div class="add-form">
        <select class="f-proj">${PROJECTS.map(p => `<option value="${escHtml(p.key)}">${escHtml(p.key)}</option>`).join('')}</select>
        <textarea class="f-title" rows="2" placeholder="작업 내용"></textarea>
        <div class="add-form-actions">
          <button type="button" class="btn-cancel">취소</button>
          <button type="button" class="btn-save">추가</button>
        </div>
      </div>
    `;
    const toggle = row.querySelector('.add-toggle');
    const form = row.querySelector('.add-form');
    const titleEl = row.querySelector('.f-title');
    const projEl = row.querySelector('.f-proj');

    toggle.addEventListener('click', () => {
      form.classList.add('open');
      toggle.hidden = true;
      titleEl.focus();
    });
    row.querySelector('.btn-cancel').addEventListener('click', () => {
      form.classList.remove('open');
      toggle.hidden = false;
      titleEl.value = '';
    });
    row.querySelector('.btn-save').addEventListener('click', () => {
      const title = titleEl.value.trim();
      if (!title) return;
      const maxOrder = Math.max(0, ...tasks.filter(t => t.status === st).map(t => t.order || 0));
      db.collection('trackerTasks').add({
        project: projEl.value,
        title,
        status: st,
        order: maxOrder + 1,
        createdAt: Date.now(),
        ...(st === 'done' ? { completedAt: Date.now() } : {}),
      });
      titleEl.value = '';
      form.classList.remove('open');
      toggle.hidden = false;
    });
  });
}

async function ensureSeeded(){
  const metaRef = db.collection('trackerMeta').doc('seed');
  const metaDoc = await metaRef.get();
  if (metaDoc.exists) return;
  const batch = db.batch();
  SEED_TASKS.forEach((t, i) => {
    const ref = db.collection('trackerTasks').doc();
    batch.set(ref, { ...t, order: i, createdAt: Date.now() });
  });
  batch.set(metaRef, { seededAt: Date.now() });
  await batch.commit();
}

// 프로젝트 이름에서 하이픈 뺀 새 표기(채용-브랜딩→채용브랜딩, 팀-블로그→팀블로그)로
// 이미 시딩된 기존 문서들을 1회 이관. 새로 시딩되는 환경은 SEED_TASKS가 이미 새 이름이라 해당 없음.
const RENAME_MAP = { '채용-브랜딩': '채용브랜딩', '팀-블로그': '팀블로그' };
async function ensureRenamed(){
  const metaRef = db.collection('trackerMeta').doc('renameV1');
  const metaDoc = await metaRef.get();
  if (metaDoc.exists) return;
  const snap = await db.collection('trackerTasks').get();
  const batch = db.batch();
  snap.docs.forEach(d => {
    const newName = RENAME_MAP[d.data().project];
    if (newName) batch.update(d.ref, { project: newName });
  });
  batch.set(metaRef, { renamedAt: Date.now() });
  await batch.commit();
}

// 완료된 지 7일 지난 카드는 자동으로 지움 — project-status.md처럼 기록용이 아니라
// "지금 할 일"만 보여주는 트래커라, 완료 항목이 계속 쌓이지 않게 함.
// completedAt이 없는(이 기능 이전에 완료된) 카드는 언제 완료됐는지 알 수 없어 건드리지 않음.
const ARCHIVE_AFTER_DAYS = 7;
async function cleanupOldDone(){
  const cutoff = Date.now() - ARCHIVE_AFTER_DAYS * 864e5;
  const snap = await db.collection('trackerTasks').get();
  const stale = snap.docs.filter(d => {
    const t = d.data();
    return t.status === 'done' && t.completedAt && t.completedAt < cutoff;
  });
  if (!stale.length) return;
  const batch = db.batch();
  stale.forEach(d => batch.delete(d.ref));
  await batch.commit();
}

async function init(){
  db = window.__athomeDb__;
  renderLegend();
  bindColumnDrop();
  bindAddForms();
  try {
    await ensureSeeded();
    await ensureRenamed();
    await cleanupOldDone();
  } catch (e) {
    console.error('[tracker] seed/rename/cleanup failed', e);
  }
  db.collection('trackerTasks').onSnapshot(snap => {
    tasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  }, err => console.error('[tracker] snapshot error', err));
}

if (window.__athomeUser__) init();
document.addEventListener('athome-auth-ready', init);
</script>
