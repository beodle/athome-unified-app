<!doctype html>
<html lang="ko">
<head>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://accounts.google.com">
  <script src="./auth.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
  <title>앳홈 조직도</title>
  <script>
    if (new URLSearchParams(location.search).get('shell') === '1') {
      document.documentElement.classList.add('shell-mode');
    }
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231A1A1A'/><rect x='12' y='55' width='18' height='33' rx='4' fill='%23FF5D00'/><rect x='41' y='35' width='18' height='53' rx='4' fill='%23FF5D00'/><rect x='70' y='18' width='18' height='70' rx='4' fill='%23FF5D00'/></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --accent:#FF5D00; --accent-light:rgba(255,93,0,.08);
  --text-1:#1A1714; --text-2:#4A4540; --text-3:#6B6660; --text-4:#8F8981;
  --bg-page:#F5F4F1; --bg-card:#FFFFFF; --bg-soft:#F0EEE9; --bg-gray:#E9E6E0;
  --border:#ECEAE5; --border-2:#DAD6CF;
  --radius:12px;
  --shadow:0 1px 2px rgba(40,30,20,.03),0 3px 14px rgba(40,30,20,.035);
  --font:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:var(--font);font-size:14px;color:var(--text-1);background:var(--bg-page);-webkit-font-smoothing:antialiased;letter-spacing:-.006em;line-height:1.6;}
button,input{font-family:inherit;}
.wrap{max-width:1360px;margin:0 auto;padding:24px 24px 72px;}

/* ── TOPBAR ── */
.topbar{position:sticky;top:0;z-index:60;background:rgba(245,244,241,.88);backdrop-filter:saturate(180%) blur(10px);-webkit-backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--border);}
.topbar-in{max-width:1360px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:14px;}
.shell-mode .topbar .brand{display:none!important;}
.shell-mode .topbar-in{max-width:none;}
.brand{display:flex;align-items:center;gap:10px;}
.brand img{height:15px;display:block;}
.brand b{font-size:15px;font-weight:800;letter-spacing:-.02em;}
.brand .sep{width:1px;height:16px;background:var(--border-2);}
.brand span{font-size:13px;font-weight:700;color:var(--text-3);}
.spacer{flex:1;}
.last-upd{font-size:12px;color:var(--text-3);white-space:nowrap;}
.sample-pill{font-size:11.5px;font-weight:700;color:#8A4A00;background:#FFF0DC;border-radius:999px;padding:3px 10px;white-space:nowrap;}

/* ── KPI ── */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.kpi{background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 20px;display:flex;flex-direction:column;gap:2px;}
.kpi-label{font-size:12px;font-weight:700;color:var(--text-3);}
.kpi-val{font-size:28px;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.kpi-val small{font-size:14px;font-weight:700;color:var(--text-3);margin-left:2px;}

/* ── TOOLBAR ── */
.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:20px 0 6px;}
.search{position:relative;flex:1 1 260px;max-width:380px;}
.search input{width:100%;height:38px;border:1px solid var(--border-2);border-radius:10px;background:var(--bg-card);padding:0 12px 0 36px;font-size:14px;color:var(--text-1);}
.search input::placeholder{color:var(--text-4);}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--text-4);fill:none;stroke-width:2;stroke-linecap:round;}
.chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{height:34px;padding:0 14px;border:1px solid var(--border-2);border-radius:999px;background:var(--bg-card);font-size:13px;font-weight:700;color:var(--text-2);cursor:pointer;transition:background .12s,color .12s,border-color .12s;}
.chip:hover{border-color:var(--text-4);}
.chip[aria-pressed="true"]{background:var(--text-1);border-color:var(--text-1);color:#fff;}
.btn-ghost{height:34px;padding:0 12px;border:none;background:none;font-size:13px;font-weight:700;color:var(--text-3);cursor:pointer;border-radius:8px;}
.btn-ghost:hover{background:var(--bg-gray);color:var(--text-1);}
.result-note{font-size:12.5px;color:var(--text-3);min-height:20px;margin:2px 0 10px;}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ── GROUP (CEO / CFO / CDO) ── */
.group{margin-top:26px;}
.group-h{display:flex;align-items:baseline;gap:10px;margin-bottom:12px;}
.group-h h2{font-size:15px;font-weight:800;letter-spacing:.02em;}
.group-h .n{font-size:12.5px;font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums;}
.group-h::after{content:"";flex:1;height:1px;background:var(--border-2);order:3;}
.divs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;align-items:start;}

/* ── DIVISION CARD ── */
.div{--c:#555;background:var(--bg-card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;}
.div-h{background:color-mix(in srgb,var(--c) 11%,#fff);padding:12px 16px 10px;border-bottom:1px solid color-mix(in srgb,var(--c) 18%,#fff);}
.div-h-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;}
.div-h h3{font-size:14.5px;font-weight:800;color:color-mix(in srgb,var(--c) 82%,#000);letter-spacing:-.015em;}
.div-h .n{font-size:12.5px;font-weight:800;color:color-mix(in srgb,var(--c) 75%,#000);font-variant-numeric:tabular-nums;white-space:nowrap;}
.leaders{padding:8px 16px 6px;border-bottom:1px solid var(--border);}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:28px;font-size:13.5px;}
.row .role{color:var(--text-3);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.row .who{display:flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap;flex-shrink:0;}
.row.lead .role{color:var(--text-2);font-weight:700;}
.row.lead .who{font-weight:800;}
.tag{font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.5;}
.tag.intern{background:var(--bg-gray);color:var(--text-3);}
.tag.dual{background:#FFF0DC;color:#8A4A00;}

/* ── TEAM (details) ── */
.team{border-bottom:1px solid var(--border);}
.team:last-child{border-bottom:none;}
.team>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:10px 16px;}
.team>summary::-webkit-details-marker{display:none;}
.team>summary:hover{background:var(--bg-soft);}
.chev{width:14px;height:14px;flex-shrink:0;stroke:var(--text-4);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s;}
.team[open]>summary .chev{transform:rotate(90deg);}
.team-name{font-size:13.5px;font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.team-lead{font-size:12.5px;color:var(--text-3);white-space:nowrap;}
.team-n{font-size:12px;font-weight:700;color:var(--text-3);min-width:28px;text-align:right;font-variant-numeric:tabular-nums;}
.team-body{padding:2px 16px 10px 38px;}
.part{margin-top:8px;padding-left:12px;border-left:2px solid var(--border-2);}
.part-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;font-weight:800;color:var(--text-2);padding:2px 0;}
.part-h .n{font-weight:700;color:var(--text-3);font-variant-numeric:tabular-nums;}
mark{background:#FFE38F;color:inherit;border-radius:3px;padding:0 1px;}

.empty{padding:48px 0;text-align:center;color:var(--text-3);font-size:14px;}

@media(max-width:900px){.kpis{grid-template-columns:repeat(2,1fr);}}
@media(max-width:560px){.wrap{padding:16px 16px 56px;}.divs{grid-template-columns:1fr;}.kpi-val{font-size:24px;}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <div class="brand">
      <img src="https://raw.githubusercontent.com/beodle/athome-assets/main/ATHOME_CI_screen.svg" alt="ATHOME" style="filter:none">
      <b>채용 콘텐츠</b><div class="sep"></div><span>조직도</span>
    </div>
    <div class="spacer"></div>
    <span class="sample-pill">샘플 데이터</span>
    <span class="last-upd" id="updated"></span>
  </div>
</header>

<div class="wrap">
  <div class="kpis" id="kpis"></div>

  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="이름, 직무, 팀 검색" aria-label="이름, 직무, 팀 검색" autocomplete="off">
    </label>
    <div class="chips" id="chips" role="group" aria-label="조직 필터"></div>
    <div class="spacer"></div>
    <button class="btn-ghost" id="toggle-all" type="button">모두 펼치기</button>
  </div>
  <p class="result-note" id="note" aria-live="polite"></p>

  <div id="org"></div>
</div>

<script>
/* 샘플 데이터: 구성원 [직무, 이름, 플래그] — 플래그 i=인턴, d=겸임. 실데이터 연동 시 이 구조로 변환해 넣는다. */
const ORG = {
  updated: '샘플',
  groups: [
    { name: 'CEO', divisions: [
      { name: 'CEO 직속', color: '#2F5A8F',
        leaders: [['리더(겸)', '김가온', 'd']],
        teams: [
          { name: 'CEO 직속', members: [['임원 비서','윤나래'],['임원 비서','권다솔'],['CEO Staff','고라온'],['AX PM','유마루'],['AX 개발','차보람']] },
          { name: '스킨케어상품기획 팀', members: [['팀 리더','이새봄'],['상품기획','장아람'],['상품기획','황여울'],['RA','문유나']] },
          { name: '디바이스상품기획 팀', members: [['팀 리더','남이든'],['RA','주재민'],['상품기획 인턴','박주아','i']] },
          { name: '법무 팀', members: [['팀 리더','임지안'],['법무','안하린'],['법무','양해든']] },
        ] },
      { name: '톰 사업 본부', color: '#3F6B3A',
        leaders: [['본부 리더(겸)', '심현우', 'd']],
        teams: [
          { name: '톰 디바이스사업 팀', members: [['팀 리더(겸)','우도하'],['국내 퍼포먼스 마케팅','최서하'],['국내 인플루언서 마케팅 인턴','한시우','i']],
            parts: [
              { name: '디바이스브랜드마케팅 파트', members: [['파트 리더(리더십트랙)','송예준'],['국내 퍼포먼스 마케팅','손은우'],['국내 브랜드 마케팅 인턴','노태이','i']] },
              { name: '디바이스콘텐츠마케팅 파트', members: [['파트 리더(겸)','우도하','d'],['국내 콘텐츠 마케팅','구하준'],['국내 콘텐츠 마케팅','정수아'],['국내 콘텐츠 마케팅','오지호']] },
            ] },
          { name: '톰 스킨케어사업 팀', members: [['팀 리더','류채원'],['국내 온라인 MD','배건우']] },
        ] },
      { name: '해외 사업 본부', color: '#6A3F8C',
        leaders: [['본부 리더(겸)', '심현우', 'd']],
        teams: [
          { name: '해외 세일즈 팀', members: [['팀 리더','하나윤'],['글로벌 영업','민다인'],['글로벌 영업','강리아'],['글로벌 영업','서민재'],['글로벌 영업 인턴','전별이','i']],
            parts: [
              { name: '해외 영업 파트', members: [['파트 리더(겸)','하나윤','d'],['글로벌 영업','백선우'],['글로벌 영업 인턴','곽세아','i']] },
              { name: '해외 MD 파트', members: [['파트 리더','나소윤'],['글로벌 온라인 MD','조승우'],['글로벌 온라인 MD','신연우']] },
            ] },
        ] },
      { name: '미닉스 사업 본부', color: '#A8386C',
        leaders: [['본부 리더', '홍율하']],
        teams: [
          { name: '미닉스 상품전략 팀', members: [['팀 리더','허의진'],['사업 전략','성준서'],['상품 전략','김지율'],['개발 PM','윤찬희']] },
          { name: '미닉스 마케팅 팀', members: [['팀 리더','권하은']],
            parts: [
              { name: '미닉스 마케팅1 파트', members: [['파트 리더','고효린'],['국내 콘텐츠 마케팅','유휘재'],['국내 인플루언서 마케팅','차가람'],['상품기획 인턴','이그린','i']] },
              { name: '미닉스 마케팅2 파트', members: [['파트 리더','장누리'],['국내 브랜드 마케팅','황다온']] },
            ] },
        ] },
      { name: '고객가치 실', color: '#7A4B2E',
        leaders: [['실 리더', '문동하']],
        teams: [
          { name: 'CX 팀', members: [['팀 리더(겸)','문동하','d'],['CX','남라희'],['CX','주무진'],['CX','박바다'],['CX','임사랑'],['CX','안소담']] },
        ] },
    ] },
    { name: 'CFO', divisions: [
      { name: 'CFO 직속', color: '#1F7A82',
        leaders: [['리더', '양슬기']],
        teams: [
          { name: 'CFO 직속', members: [['CFO Staff','심아윤']] },
          { name: '재무 팀', members: [['회계','우여름'],['회계','최온유'],['회계','한이안'],['재무','송정우'],['자금','손하늘']] },
          { name: 'SCM 팀', members: [['팀 리더','노한결'],['국내 SCM','구호진'],['국내 SCM','정희재'],['국내 SCM','오담이'],['국내 SCM 인턴','류로운','i']] },
          { name: '구매 팀', members: [['팀 리더(리더십트랙)','배모아'],['구매','하새론']] },
        ] },
    ] },
    { name: 'CDO', divisions: [
      { name: '크리에이티브 본부', color: '#B8342F',
        leaders: [['본부 리더', '민시은']],
        teams: [
          { name: '제품경험디자인 팀', members: [['팀 리더','강아린'],['제품 디자인','서윤찬']] },
          { name: '브랜드디자인 팀', members: [['팀 리더','전재이'],['BX 디자인','백정원'],['브랜드 디자인','곽푸름'],['브랜드 디자인 인턴','나해솔','i']],
            parts: [
              { name: '미닉스 디자인 파트', members: [['파트 리더','조현서'],['브랜드 디자인','신가온'],['브랜드 디자인','홍나래'],['브랜드 디자인','허다솔']] },
              { name: '톰 디자인 파트', members: [['파트 리더(겸)','전재이','d'],['브랜드 디자인','성라온'],['브랜드 디자인','김마루']] },
            ] },
        ] },
    ] },
  ]
};

const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const isLead = role => /리더/.test(role);
const norm = s => s.toLowerCase();

const teamMembers = t => [...t.members, ...(t.parts || []).flatMap(p => p.members)];
const divMembers = d => [...d.leaders, ...d.teams.flatMap(teamMembers)];
const flagOf = m => m[2] || '';

/* 겸임(d)은 다른 곳에서 이미 센 사람이라 총 인원에서 제외한다. 겸임 수는 별도 표기. */
function stats() {
  const all = ORG.groups.flatMap(g => g.divisions.flatMap(divMembers));
  const real = all.filter(m => flagOf(m) !== 'd');
  const interns = real.filter(m => flagOf(m) === 'i').length;
  return { total: real.length, regular: real.length - interns, interns, dual: all.length - real.length };
}
const countOf = ms => ms.filter(m => flagOf(m) !== 'd').length;

function renderKpis() {
  const s = stats();
  $('kpis').replaceChildren(...[['총 인원', s.total], ['인턴 제외', s.regular], ['인턴', s.interns], ['겸임', s.dual]].map(([label, v]) => {
    const k = el('div', 'kpi');
    k.append(el('span', 'kpi-label', label));
    const val = el('span', 'kpi-val', String(v));
    val.append(el('small', null, '명'));
    k.append(val);
    return k;
  }));
  $('updated').textContent = '기준일 ' + ORG.updated;
}

/* ── 검색 하이라이트 ── */
let query = '';
function hl(text, parent) {
  const q = query;
  if (!q) { parent.append(document.createTextNode(text)); return parent; }
  const i = norm(text).indexOf(q);
  if (i < 0) { parent.append(document.createTextNode(text)); return parent; }
  parent.append(document.createTextNode(text.slice(0, i)));
  parent.append(el('mark', null, text.slice(i, i + q.length)));
  parent.append(document.createTextNode(text.slice(i + q.length)));
  return parent;
}

function memberRow(m) {
  const [role, name, f] = m;
  const row = el('div', 'row' + (isLead(role) ? ' lead' : ''));
  row.append(hl(role, el('span', 'role')));
  const who = el('span', 'who');
  hl(name, who);
  if (f === 'i') who.append(el('span', 'tag intern', '인턴'));
  if (f === 'd') who.append(el('span', 'tag dual', '겸임'));
  row.append(who);
  return row;
}

const matchM = m => !query || norm(m[0]).includes(query) || norm(m[1]).includes(query);
const matchName = n => !query || norm(n).includes(query);

function renderPart(p, whole) {
  const ms = whole ? p.members : p.members.filter(matchM);
  if (!ms.length) return null;
  const box = el('div', 'part');
  const h = el('div', 'part-h');
  h.append(hl(p.name, el('span')), el('span', 'n', countOf(p.members) + '명'));
  box.append(h, ...ms.map(memberRow));
  return box;
}

function renderTeam(t, divWhole) {
  const whole = divWhole || matchName(t.name);
  const ms = whole ? t.members : t.members.filter(matchM);
  const parts = (t.parts || []).map(p => renderPart(p, whole || matchName(p.name))).filter(Boolean);
  if (query && !whole && !ms.length && !parts.length) return null;

  const d = el('details', 'team');
  if (query) d.open = true;
  const sum = el('summary');
  const chev = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  chev.setAttribute('viewBox', '0 0 24 24'); chev.setAttribute('class', 'chev'); chev.setAttribute('aria-hidden', 'true');
  chev.innerHTML = '<path d="M9 6l6 6-6 6"/>';
  sum.append(chev, hl(t.name, el('span', 'team-name')));
  const lead = teamMembers(t).find(m => isLead(m[0]) && flagOf(m) !== 'd');
  if (lead) sum.append(el('span', 'team-lead', lead[1]));
  sum.append(el('span', 'team-n', countOf(teamMembers(t)) + '명'));
  d.append(sum);

  const body = el('div', 'team-body');
  body.append(...ms.map(memberRow), ...parts);
  d.append(body);
  return d;
}

function renderDivision(dv) {
  const whole = matchName(dv.name);
  const leaders = whole ? dv.leaders : dv.leaders.filter(matchM);
  const teams = dv.teams.map(t => renderTeam(t, whole)).filter(Boolean);
  if (query && !whole && !leaders.length && !teams.length) return null;

  const card = el('section', 'div');
  card.style.setProperty('--c', dv.color);
  const head = el('div', 'div-h');
  const top = el('div', 'div-h-top');
  top.append(hl(dv.name, el('h3')), el('span', 'n', countOf(divMembers(dv)) + '명'));
  head.append(top);
  card.append(head);
  if (leaders.length) {
    const box = el('div', 'leaders');
    box.append(...leaders.map(memberRow));
    card.append(box);
  }
  card.append(...teams);
  return card;
}

let activeGroup = '전체';
function render() {
  const org = $('org');
  org.replaceChildren();
  let hits = 0;
  ORG.groups.forEach(g => {
    if (activeGroup !== '전체' && g.name !== activeGroup) return;
    const cards = g.divisions.map(renderDivision).filter(Boolean);
    if (!cards.length) return;
    hits += cards.length;
    const sec = el('section', 'group');
    const h = el('div', 'group-h');
    h.append(el('h2', null, g.name), el('span', 'n', countOf(g.divisions.flatMap(divMembers)) + '명'));
    const grid = el('div', 'divs');
    grid.append(...cards);
    sec.append(h, grid);
    org.append(sec);
  });
  if (!hits) org.append(el('div', 'empty', '검색 결과가 없어요'));
  $('note').textContent = query ? `"${$('q').value.trim()}" 검색 결과: ${hits}개 조직` : '';
  syncToggle();
}

function syncToggle() {
  const ds = [...document.querySelectorAll('details.team')];
  $('toggle-all').textContent = ds.length && ds.every(d => d.open) ? '모두 접기' : '모두 펼치기';
}

function renderChips() {
  const names = ['전체', ...ORG.groups.map(g => g.name)];
  $('chips').replaceChildren(...names.map(n => {
    const b = el('button', 'chip', n);
    b.type = 'button';
    b.setAttribute('aria-pressed', String(n === activeGroup));
    b.addEventListener('click', () => {
      activeGroup = n;
      $('chips').querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', String(c.textContent === n)));
      render();
    });
    return b;
  }));
}

$('q').addEventListener('input', e => { query = norm(e.target.value.trim()); render(); });
$('toggle-all').addEventListener('click', () => {
  const ds = [...document.querySelectorAll('details.team')];
  const open = !ds.every(d => d.open);
  ds.forEach(d => { d.open = open; });
  syncToggle();
});
$('org').addEventListener('toggle', syncToggle, true);

renderKpis();
renderChips();
render();
</script>
</body>
</html>
