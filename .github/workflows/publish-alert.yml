name: Daily Publish Alert

# 매일 08:30 KST — 콘텐츠 캘린더에서 오늘 발행 예정 항목을 Slack으로 알림
# SLACK_WEBHOOK_URL 시크릿이 없으면 조용히 건너뜀 (발행 예정이 없는 날도 발송 안 함)
on:
  schedule:
    - cron: '30 23 * * *'   # 23:30 UTC = 다음날 08:30 KST
  workflow_dispatch:

permissions: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install --quiet google-auth requests

      - name: Check today's scheduled posts and notify Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SHEET_SA_KEY: ${{ secrets.SHEET_SA_KEY }}
        run: |
          python3 - <<'PY'
          import os, json, datetime, urllib.request
          from google.oauth2 import service_account
          from google.auth.transport.requests import AuthorizedSession

          hook = os.environ.get('SLACK_WEBHOOK_URL', '')
          if not hook:
              print('SLACK_WEBHOOK_URL 미설정 — 건너뜀')
              raise SystemExit(0)

          KST = datetime.timezone(datetime.timedelta(hours=9))
          today = datetime.datetime.now(KST).date()
          today_str = today.isoformat()

          # 시트는 "제한됨"이라 시트 전용 서비스 계정으로 Sheets API 조회
          SID, GID = '1bnLQypIuMb0gw0RxzwYVkqGBdN8KSA4_TXSuogaOWak', '658998951'
          creds = service_account.Credentials.from_service_account_info(
              json.loads(os.environ['SHEET_SA_KEY']),
              scopes=['https://www.googleapis.com/auth/spreadsheets.readonly'])
          sess = AuthorizedSession(creds)
          base = f'https://sheets.googleapis.com/v4/spreadsheets/{SID}'
          meta = sess.get(base, params={'fields': 'sheets.properties'}, timeout=30)
          meta.raise_for_status()
          title = next(s['properties']['title'] for s in meta.json()['sheets']
                       if str(s['properties']['sheetId']) == GID)
          q = "'" + title.replace("'", "''") + "'"
          vr = sess.get(f'{base}/values/{q}', timeout=30)
          vr.raise_for_status()
          values = vr.json().get('values', [])
          head = [h.strip() for h in values[0]] if values else []
          rows = [{h: (row[i] if i < len(row) else '') for i, h in enumerate(head)} for row in values[1:]]
          todays = [r for r in rows if (r.get('시기') or '').strip() == today_str]

          if not todays:
              print(f'{today_str} 발행 예정 없음 — 알림 생략')
              raise SystemExit(0)

          lines = []
          for r in todays:
              ch    = (r.get('채널') or '').strip()
              title = (r.get('주요 주제') or '').strip()
              note  = (r.get('비고') or '').strip()
              lines.append(f'• *[{ch}]* {title}' + (f' — {note}' if note else ''))

          msg = (f':calendar: *오늘({today.month}/{today.day}) 발행 예정 {len(todays)}건*\n'
                 + '\n'.join(lines)
                 + '\n<https://beodle.github.io/athome-unified-app/#/calendar|캘린더 열기>')

          req = urllib.request.Request(
              hook,
              data=json.dumps({'text': msg}).encode(),
              headers={'Content-Type': 'application/json'})
          resp = urllib.request.urlopen(req, timeout=30)
          print('Slack 발송 완료:', resp.status)
          PY
